name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate VPS one-command installer
        run: |
          bash -n scripts/install-vps.sh
          help="$(bash scripts/install-vps.sh --help)"
          grep -F -- "--proxy-mode MODE" <<<"$help"
          grep -F -- "--local-port PORT" <<<"$help"
      - name: Install Ptah migration runner
        env:
          PTAH_VERSION: 0.12.0
        run: |
          archive="ptah_${PTAH_VERSION}_linux_amd64.tar.gz"
          release="https://github.com/stokaro/ptah/releases/download/v${PTAH_VERSION}"
          mkdir -p "$RUNNER_TEMP/ptah"
          cd "$RUNNER_TEMP/ptah"
          curl --fail --location --retry 3 "$release/$archive" -o "$archive"
          curl --fail --location --retry 3 "$release/checksums.txt" -o checksums.txt
          awk -v file="$archive" '$2 == file' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum -c selected-checksum.txt
          tar -xzf "$archive" ptah
          echo "$RUNNER_TEMP/ptah" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify packaged migration runner
        run: |
          docker build -t mailcollector:ci .
          docker run --rm mailcollector:ci node --input-type=module -e '
            import { MailDatabase } from "./dist/database.js";
            const db = new MailDatabase("/app/data/smoke.db");
            db.listMessages({ query: "invoice", limit: 1, offset: 0 });
            db.close();
            new MailDatabase("/app/data/smoke.db").close();
          '

  rust:
    name: Rust desktop client checks
    runs-on: windows-2022
    env:
      npm_config_msvs_version: "2022"
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install application dependencies
        run: npm ci --prefix ..
      - name: Build client frontend
        run: npm run build:desktop --prefix ..
      - name: Validate Windows release scripts
        shell: pwsh
        working-directory: .
        run: |
          foreach ($file in @("scripts/check-release-readiness.ps1", "scripts/prepare-windows-signing.ps1", "scripts/verify-windows-signing.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - run: cargo fmt --check
      - run: cargo test --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
